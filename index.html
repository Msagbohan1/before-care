<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before Care: Know Your Costs</title>
<style>
  :root{
    --ink:#16243a;--ink2:#4d5b6e;--line:#dfe5ec;--soft:#f4f7fa;--bg:#ffffff;
    --teal:#0f766e;--teal-50:#e6f4f2;--teal-200:#a7dcd5;
    --amber:#8a5a00;--amber-50:#fff6e0;--amber-200:#f6d58a;
    --red:#a1301c;--red-50:#fdecea;--red-200:#f3b9ae;
    --blue:#1d4f91;--blue-50:#eaf1fb;
    --radius:16px;--shadow:0 1px 2px rgba(22,36,58,.06),0 4px 14px rgba(22,36,58,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--soft);line-height:1.5;font-size:17px;-webkit-text-size-adjust:100%}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 48px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .logo svg{width:22px;height:22px}
  .brand{flex:1;min-width:0}
  .brand h1{font-size:20px;line-height:1.2}
  .brand p{font-size:13px;color:var(--ink2)}
  select,input,textarea,button{font:inherit;color:inherit}
  .lang{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:15px}
  .demo{background:var(--amber-50);border:1.5px solid var(--amber-200);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
  h2{font-size:18px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .num{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  label{display:block;font-weight:600;font-size:15px;margin:12px 0 5px}
  .hint{font-size:13px;color:var(--ink2);margin-top:4px}
  .field{width:100%;border:1.5px solid #c5cfda;border-radius:12px;padding:11px 12px;background:#fff;min-height:48px}
  .field:focus,.lang:focus,button:focus-visible,summary:focus-visible{outline:3px solid #6aa6e8;outline-offset:2px}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label{margin:0;border:1.5px solid #c5cfda;border-radius:12px;padding:10px 4px;text-align:center;font-size:14px;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:center;background:#fff}
  .seg input:checked+label{background:var(--teal-50);border-color:var(--teal);color:var(--teal);font-weight:700}
  .seg input:focus-visible+label{outline:3px solid #6aa6e8;outline-offset:2px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .money{position:relative}
  .money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2)}
  .money input{padding-left:26px}
  .plansum{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
  .seg2{grid-template-columns:1fr 1fr;margin-bottom:4px}
  .upbox{border:1.5px dashed var(--teal-200);background:var(--teal-50);border-radius:14px;padding:14px;margin-top:12px}
  .upt{font-weight:700;font-size:16px}
  label.btn{display:flex;margin-bottom:0}
  .sub{font-weight:700;font-size:16px;margin-top:16px}
  .money.pct span{left:auto;right:12px}
  .money.pct input{padding-left:12px;padding-right:28px}
  .tag{display:inline-block;font-size:12px;font-weight:700;margin-top:4px;border-radius:999px;padding:1px 8px}
  .tag:empty{display:none}
  .tag.found{background:var(--teal-50);color:var(--teal)}
  .tag.check{background:var(--amber-50);color:var(--amber)}
  [hidden]{display:none!important}
  .plansum b{font-weight:700}
  /* results */
  .status{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .status:last-child{border-bottom:none}
  .pill{flex-shrink:0;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-top:2px;white-space:nowrap}
  .p-yes{background:var(--red-50);color:var(--red);border:1px solid var(--red-200)}
  .p-maybe{background:var(--amber-50);color:var(--amber);border:1px solid var(--amber-200)}
  .p-no{background:var(--teal-50);color:var(--teal);border:1px solid var(--teal-200)}
  .status h3{font-size:16px}
  .status p{font-size:14px;color:var(--ink2)}
  .big{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
  .bigsub{font-size:14px;color:var(--ink2);margin-bottom:12px}
  .rows{border-top:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row b{white-space:nowrap}
  .row.total{font-weight:800;border-bottom:none}
  .bar{height:14px;border-radius:999px;background:#e9eef3;overflow:hidden;display:flex;margin:10px 0 4px}
  .bar i{display:block;height:100%}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .alert{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
  .a-red{background:var(--red-50);border:1.5px solid var(--red-200);color:var(--red)}
  .a-amber{background:var(--amber-50);border:1.5px solid var(--amber-200);color:var(--amber)}
  .a-teal{background:var(--teal-50);border:1.5px solid var(--teal-200);color:var(--teal)}
  .a-blue{background:var(--blue-50);border:1.5px solid #bcd2f0;color:var(--blue)}
  .dedtxt{font-size:15px;margin-top:4px}
  /* glossary */
  details{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
  summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:22px;color:var(--teal);font-weight:400}
  details[open] summary::after{content:"–"}
  details p{padding:0 14px 12px;font-size:15px;color:var(--ink2)}
  /* script */
  ol.script{padding-left:22px}
  ol.script li{margin:6px 0;font-size:15px}
  .who{font-size:14px;font-weight:700;color:var(--teal);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.04em}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;border:none;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
  .btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
  .btn:active{transform:translateY(1px)}
  ul.tips{padding-left:20px}
  ul.tips li{margin:7px 0;font-size:15px}
  .ok{display:none}
  footer{font-size:13px;color:var(--ink2);text-align:center;margin-top:20px}
  footer a{color:var(--blue)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  @media (min-width:560px){.big{font-size:46px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M12 8.5v6M9 11.5h6"/></svg></div>
  <div class="brand"><h1 data-t="title"></h1><p data-t="tagline"></p></div>
  <label class="sr" for="lang">Language</label>
  <select id="lang" class="lang" aria-label="Language / Idioma / Langue">
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
  </select>
</header>

<div class="demo" role="note" data-t="demo"></div>

<!-- STEP 1 -->
<section class="card" aria-labelledby="h1">
  <h2 id="h1"><span class="num">1</span><span data-t="s1"></span></h2>
  <label for="service" data-t="service"></label>
  <select id="service" class="field"></select>
  <label data-t="network" id="netlbl"></label>
  <div class="seg" role="radiogroup" aria-labelledby="netlbl">
    <input type="radio" name="net" id="net-in" value="in" checked><label for="net-in" data-t="netIn"></label>
    <input type="radio" name="net" id="net-out" value="out"><label for="net-out" data-t="netOut"></label>
    <input type="radio" name="net" id="net-unsure" value="unsure"><label for="net-unsure" data-t="netUnsure"></label>
  </div>
  <p class="hint" data-t="netHint"></p>
</section>

<!-- STEP 2 -->
<section class="card" aria-labelledby="h2">
  <h2 id="h2"><span class="num">2</span><span data-t="s2"></span></h2>
  <div class="seg seg2" role="radiogroup" aria-label="Plan source">
    <input type="radio" name="src" id="src-sample" value="sample" checked><label for="src-sample" data-t="srcSample"></label>
    <input type="radio" name="src" id="src-own" value="own"><label for="src-own" data-t="srcOwn"></label>
  </div>

  <div id="samplePane">
    <label for="plan" data-t="plan"></label>
    <select id="plan" class="field"></select>
  </div>

  <div id="ownPane" hidden>
    <div class="upbox">
      <p class="upt" data-t="upTitle"></p>
      <p class="hint" data-t="upHint"></p>
      <label class="btn" for="sbcFile" style="margin-top:10px"><span data-t="upBtn"></span></label>
      <input type="file" id="sbcFile" accept="application/pdf,.pdf" class="sr">
      <button type="button" class="btn ghost" id="sampleSbc" data-t="upSample"></button>
      <p class="hint" data-t="upPrivacy" style="margin-top:8px"></p>
      <div id="upStatus" role="status" aria-live="polite"></div>
    </div>

    <p class="sub" data-t="ownTitle"></p>
    <p class="hint" data-t="ownHint"></p>
    <div class="two">
      <div><label for="o_ded" data-t="oDed"></label><div class="money"><span>$</span><input id="o_ded" class="field own" type="number" inputmode="numeric" min="0"></div><span class="tag" id="tg_ded"></span></div>
      <div><label for="o_oop" data-t="oOop"></label><div class="money"><span>$</span><input id="o_oop" class="field own" type="number" inputmode="numeric" min="0"></div><span class="tag" id="tg_oop"></span></div>
      <div><label for="o_pcp" data-t="oPcp"></label><div class="money"><span>$</span><input id="o_pcp" class="field own" type="number" inputmode="numeric" min="0"></div><span class="tag" id="tg_pcp"></span></div>
      <div><label for="o_spec" data-t="oSpec"></label><div class="money"><span>$</span><input id="o_spec" class="field own" type="number" inputmode="numeric" min="0"></div><span class="tag" id="tg_spec"></span></div>
      <div><label for="o_coins" data-t="oCoins"></label><div class="money pct"><input id="o_coins" class="field own" type="number" inputmode="numeric" min="0" max="100"><span>%</span></div><span class="tag" id="tg_coins"></span></div>
      <div><label for="o_ref" data-t="oRef"></label><select id="o_ref" class="field own"><option value="no" data-t="optNo"></option><option value="yes" data-t="optYes"></option></select><span class="tag" id="tg_ref"></span></div>
      <div><label for="o_oon" data-t="oOon"></label><select id="o_oon" class="field own"><option value="yes" data-t="optCovered"></option><option value="no" data-t="optNotCovered"></option></select><span class="tag" id="tg_oon"></span></div>
      <div><label for="o_ooncoins" data-t="oOonCoins"></label><div class="money pct"><input id="o_ooncoins" class="field own" type="number" inputmode="numeric" min="0" max="100"><span>%</span></div><span class="tag" id="tg_ooncoins"></span></div>
    </div>
    <p class="hint" data-t="copayHint"></p>
  </div>

  <div class="plansum" id="plansum"></div>
  <div class="two">
    <div>
      <label for="dedMet" data-t="dedMet"></label>
      <div class="money"><span>$</span><input id="dedMet" class="field" type="number" inputmode="numeric" min="0" step="50" value="0"></div>
    </div>
    <div>
      <label for="oopMet" data-t="oopMet"></label>
      <div class="money"><span>$</span><input id="oopMet" class="field" type="number" inputmode="numeric" min="0" step="50" value="0"></div>
    </div>
  </div>
  <p class="hint" data-t="metHint"></p>
</section>

<!-- RESULTS -->
<section class="card" aria-labelledby="h3" aria-live="polite">
  <h2 id="h3"><span class="num">3</span><span data-t="s3"></span></h2>
  <div id="approvals"></div>
</section>

<section class="card" aria-labelledby="h4" aria-live="polite">
  <h2 id="h4"><span class="num">4</span><span data-t="s4"></span></h2>
  <div id="cost"></div>
</section>

<!-- WHAT TO ASK -->
<section class="card" aria-labelledby="h5">
  <h2 id="h5"><span class="num">5</span><span data-t="s5"></span></h2>
  <p class="hint" data-t="askIntro"></p>
  <div id="script"></div>
  <button class="btn ghost" id="copyBtn" type="button" data-t="copy"></button>
  <p class="hint" id="copied" role="status"></p>
</section>

<!-- CAN'T PAY -->
<section class="card" aria-labelledby="h6">
  <h2 id="h6"><span class="num">6</span><span data-t="s6"></span></h2>
  <ul class="tips" id="tips"></ul>
</section>

<!-- GLOSSARY -->
<section class="card" aria-labelledby="h7">
  <h2 id="h7"><span class="num">7</span><span data-t="s7"></span></h2>
  <div id="glossary"></div>
</section>

<!-- CALLBACK -->
<section class="card" aria-labelledby="h8">
  <h2 id="h8"><span class="num">8</span><span data-t="s8"></span></h2>
  <p class="hint" data-t="cbIntro"></p>
  <form id="cbForm" novalidate>
    <label for="cbName" data-t="cbName"></label>
    <input id="cbName" class="field" type="text" autocomplete="off">
    <label for="cbPhone" data-t="cbPhone"></label>
    <input id="cbPhone" class="field" type="tel" autocomplete="off">
    <label for="cbLang" data-t="cbLang"></label>
    <select id="cbLang" class="field">
      <option>English</option><option>Español</option><option>Français</option><option data-t="cbOther"></option>
    </select>
    <label for="cbTime" data-t="cbTime"></label>
    <select id="cbTime" class="field">
      <option data-t="morning"></option><option data-t="afternoon"></option><option data-t="evening"></option>
    </select>
    <button class="btn" type="submit" data-t="cbSend"></button>
  </form>
  <div class="alert a-teal ok" id="cbOk" role="status" tabindex="-1"></div>
</section>

<footer>
  <p data-t="foot1"></p>
  <p style="margin-top:6px"><a href="https://www.cms.gov/nosurprises/consumers" target="_blank" rel="noopener" data-t="footLink"></a></p>
</footer>
</div>

for(const l in T2) Object.assign(T[l], T2[l]);

/* ───────── Helpers ───────── */
let L = 'en';
try{ const s = localStorage.getItem('beforecare_lang'); if(T[s]) L = s; }catch(e){}
const $ = id => document.getElementById(id);
const t = (k, vars) => { let s = T[L][k] ?? T.en[k] ?? k; if(vars) for(const v in vars) s = s.split('{'+v+'}').join(vars[v]); return s; };
const LOCALE = {en:'en-US', es:'es-US', fr:'fr-CA'};
const money = n => new Intl.NumberFormat(LOCALE[L], {style:'currency', currency:'USD', maximumFractionDigits:0}).format(Math.round(n));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───────── The cost calculation ───────── */
// Returns what the patient would pay for one service under one sample plan.
function estimate(svcKey, planKey, net, dedMet, oopMet){
  const s = SERVICES[svcKey], p = PLANS[planKey];
  const r = {price:s.price, ded:0, coins:0, copay:0, balance:0, total:0, plan:0, coinsPct:0,
             dedApplies:true, dedLeftBefore:0, dedLeftAfter:0, capped:false, oopReached:false, notCovered:false, oon:false};
  const useOon = net === 'out';
  if(useOon && !p.oon){                       // HMO: out-of-network not covered
    r.notCovered = true; r.oon = true; r.total = s.price; r.balance = 0; r.plan = 0;
    r.dedApplies = false; return r;
  }
  if(useOon){                                 // PPO / HDHP out of network
    r.oon = true;
    const billed = s.price * p.oon.billedMult;
    r.dedLeftBefore = p.oon.ded;               // assume nothing met out of network yet
    r.ded = Math.min(s.price, r.dedLeftBefore);
    r.coins = (s.price - r.ded) * p.oon.coins;
    r.coinsPct = p.oon.coins * 100;
    r.balance = billed - s.price;              // provider may bill the difference
    r.dedLeftAfter = r.dedLeftBefore - r.ded;
    r.total = r.ded + r.coins + r.balance;
    r.plan = s.price - r.ded - r.coins;
    return r;                                   // out-of-network costs do not count toward the in-network max
  }
  const dedLeft = Math.max(0, p.ded - dedMet);
  const oopLeft = Math.max(0, p.oop - Math.max(oopMet, dedMet));
  r.dedLeftBefore = dedLeft;
  if(oopLeft === 0){ r.oopReached = true; r.plan = s.price; r.dedLeftAfter = dedLeft; return r; }
  if(s.kind === 'copay' && p.copay && p.copay[s.copayKey] != null){   // fixed copay, deductible does not apply
    r.dedApplies = false;
    r.copay = Math.min(p.copay[s.copayKey], s.price);
  } else {                                    // deductible first, then coinsurance
    r.ded = Math.min(s.price, dedLeft);
    r.coins = (s.price - r.ded) * p.coins;
    r.coinsPct = p.coins * 100;
  }
  let total = r.ded + r.coins + r.copay;
  if(total > oopLeft){                        // never more than what is left of the yearly max
    let over = total - oopLeft;               // trim coinsurance first, then copay, then deductible
    const cut = (k) => { const d = Math.min(r[k], over); r[k] -= d; over -= d; };
    cut('coins'); cut('copay'); cut('ded');
    total = oopLeft; r.capped = true;
  }
  r.total = total;
  r.plan = s.price - total;
  r.dedLeftAfter = Math.max(0, dedLeft - r.ded);
  return r;
}

/* ───────── "Use my own plan": reading a Summary of Benefits PDF ───────── */
// Everything here runs in the browser. The file is never sent anywhere or saved.
const OWN = {pa:{}, found:{}};
const OWN_FIELDS = ['ded','oop','pcp','spec','coins','ref','oon','ooncoins'];
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsReady = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsReady) pdfjsReady = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfjsReady = null; fail(new Error('lib')); };
    document.head.appendChild(sc);
  });
  return pdfjsReady;
}
async function pdfText(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: buf}).promise;
  let out = '';
  for(let i = 1; i <= Math.min(doc.numPages, 12); i++){
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    out += ' ' + tc.items.map(x => x.str).join(' ');
  }
  return out.replace(/\s+/g, ' ');
}
// Reads the standard SBC wording. Returns only what it actually finds.
function parseSBC(text){
  const num = s => +String(s).replace(/,/g, '');
  const after = (re, len) => { const m = re.exec(text); return m ? text.slice(m.index + m[0].length, m.index + m[0].length + len) : null; };
  const firstMoney = seg => { const m = seg && seg.match(/\$\s?([\d,]+)/); return m ? num(m[1]) : null; };
  const r = {pa:{}};
  r.ded = firstMoney(after(/overall\s+deductible\s*\??/i, 300));
  r.oop = firstMoney(after(/out-of-pocket\s+limit\s+for\s+this\s+plan\s*\??/i, 300));
  const ref = after(/referral\s+to\s+see\s+a\s+specialist\s*\??/i, 40);
  if(ref){ const m = ref.match(/^\W*(yes|no)\b/i); if(m) r.ref = m[1].toLowerCase(); }
  const visit = seg => {                       // copay, "no charge", or coinsurance first?
    if(!seg) return undefined;
    const cp = seg.match(/\$\s?([\d,]+)\s*copay/i), nc = seg.search(/no charge/i), co = seg.search(/\d+\s*%\s*coinsurance/i);
    const cpAt = cp ? seg.indexOf(cp[0]) : -1;
    if(cpAt >= 0 && (co < 0 || cpAt < co)) return num(cp[1]);
    if(nc >= 0 && (co < 0 || nc < co)) return 0;
    if(co >= 0) return null;                   // coinsurance: no copay, deductible applies
    return undefined;
  };
  const pcp = visit(after(/primary\s+care\s+visit/i, 180));
  const spec = visit(after(/specialist\s+visit/i, 140));
  if(pcp !== undefined) r.pcp = pcp;
  if(spec !== undefined) r.spec = spec;
  const diag = after(/diagnostic\s+test/i, 260) || after(/imaging/i, 260) || '';
  const pcts = [...diag.matchAll(/(\d+)\s*%\s*coinsurance/gi)].map(m => +m[1]);
  if(pcts.length) r.coins = pcts[0];
  if(/not\s+covered/i.test(diag.slice(0, 160))) r.oon = 'no';
  else if(pcts.length > 1){ r.oon = 'yes'; r.ooncoins = pcts[1]; }
  const type = text.match(/plan\s+type\s*:?\s*(HMO|EPO|PPO|POS|HDHP)/i);
  if(type){ r.type = type[1].toUpperCase(); if(!r.oon && /HMO|EPO/.test(r.type)) r.oon = 'no'; }
  const needsPA = re => { const seg = after(re, 380); return seg ? /pre-?authori[sz]|prior\s+authori[sz]|pre-?certif/i.test(seg) : false; };
  const img = needsPA(/imaging\s*\(?\s*CT/i);
  r.pa = {mri: img, ct: img,
          surgOut: needsPA(/outpatient\s+surgery/i),
          surgIn: needsPA(/hospital\s+stay/i),
          med: needsPA(/specialty\s+drugs/i),
          pt: needsPA(/rehabilitation\s+services/i)};
  return r;
}
function fillOwn(r){
  OWN.pa = r.pa || {}; OWN.found = {};
  OWN_FIELDS.forEach(k => {
    const el = $('o_' + k), has = r[k] !== undefined && r[k] !== null || (k === 'pcp' || k === 'spec') && r[k] === null;
    if(r[k] !== undefined){ el.value = r[k] === null ? '' : r[k]; }
    OWN.found[k] = r[k] !== undefined;
  });
  paintTags();
  return OWN_FIELDS.filter(k => OWN.found[k]).length;
}
function paintTags(){
  OWN_FIELDS.forEach(k => {
    const tg = $('tg_' + k);
    if(OWN.found[k] === undefined){ tg.textContent = ''; tg.className = 'tag'; return; }
    tg.textContent = OWN.found[k] ? t('found') : t('check');
    tg.className = 'tag ' + (OWN.found[k] ? 'found' : 'check');
  });
}
function upStatus(cls, msg){ $('upStatus').innerHTML = msg ? `<div class="alert ${cls}">${esc(msg)}</div>` : ''; }
async function readPdf(buf){
  upStatus('a-blue', t('upReading'));
  let text;
  try{ text = await pdfText(buf); }
  catch(e){ upStatus('a-amber', e.message === 'lib' ? t('upLib') : t('upFail')); return; }
  if(text.replace(/\s/g, '').length < 40){ upStatus('a-amber', t('upFail')); return; }
  const n = fillOwn(parseSBC(text));
  if(n === 0) upStatus('a-amber', t('upFail'));
  else upStatus(n === 8 ? 'a-teal' : 'a-amber', t('upDone', {n}) + (n < 8 ? ' ' + t('upPartial') : ''));
  render();
}
// Builds a plan from the boxes the patient checked or typed.
function ownPlan(){
  const v = id => { const x = $(id).value.trim(); return x === '' ? null : Math.max(0, +x); };
  const ded = v('o_ded'), oop = v('o_oop');
  if(ded === null || oop === null) return null;
  const pcp = v('o_pcp'), spec = v('o_spec'), coins = (v('o_coins') ?? 20) / 100;
  const oonCovered = $('o_oon').value === 'yes';
  return {ded, oop: Math.max(oop, ded), coins,
          copay: (pcp !== null || spec !== null) ? {pcp, spec} : null,
          referral: $('o_ref').value === 'yes',
          oon: oonCovered ? {ded: ded * 2, coins: (v('o_ooncoins') ?? Math.min(100, coins * 200)) / 100, billedMult: 1.6} : null};
}

/* ───────── Drawing the page ───────── */
function fillSelect(sel, obj, keys){
  const cur = sel.value;
  sel.innerHTML = keys.map(k => `<option value="${k}">${esc(obj[k])}</option>`).join('');
  if(cur && keys.includes(cur)) sel.value = cur;
}
function staticText(){
  document.documentElement.lang = L;
  document.title = t('title') + ' · ' + t('tagline');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  fillSelect($('service'), T[L].svc, Object.keys(SERVICES));
  fillSelect($('plan'), T[L].pln, Object.keys(PLANS));
  $('glossary').innerHTML = T[L].g.map(([w,d]) => `<details><summary>${esc(w)}</summary><p>${esc(d)}</p></details>`).join('');
  $('tips').innerHTML = ['t1','t2','t3','t4','t5'].map(k => `<li>${esc(t(k))}</li>`).join('');
}
function planSummary(pk){
  const p = PLANS[pk];
  const parts = [
    `<b>${t('sumDed')}:</b> ${money(p.ded)}`,
    `<b>${t('sumOop')}:</b> ${money(p.oop)}`,
    `<b>${t('sumCoins')}:</b> ${p.coins*100}%`,
    p.copay ? `<b>${t('sumCopay')}:</b> ${money(p.copay.pcp)} / ${money(p.copay.spec)}` : esc(t('sumNoCopay')),
  ];
  let extra = '';
  if(p.referral) extra += `<div style="margin-top:4px">• ${esc(t('sumRef'))}</div>`;
  if(!p.oon) extra += `<div>• ${esc(t('sumOonNo'))}</div>`;
  $('plansum').innerHTML = parts.join(' · ') + extra;
}
function statusRow(title, level, text){
  const cls = {yes:'p-yes', no:'p-no', maybe:'p-maybe'}[level];
  return `<div class="status"><span class="pill ${cls}">${esc(t(level))}</span><div><h3>${esc(title)}</h3><p>${esc(text)}</p></div></div>`;
}
function render(){
  const sk = $('service').value, pk = $('plan').value;
  const net = document.querySelector('input[name="net"]:checked').value;
  const dedMet = Math.max(0, +$('dedMet').value || 0);
  const oopMet = Math.max(0, +$('oopMet').value || 0);
  const s = SERVICES[sk], p = PLANS[pk];
  planSummary(pk);

  // approvals
  const paText = {yes:t('paYes'), no:t('paNo'), maybe:t('paMaybe')}[s.pa];
  let a = statusRow(t('paT'), s.pa, paText);
  a += statusRow(t('precertT'), s.precert ? 'yes' : 'no', s.precert ? t('precertYes') : t('precertNo'));
  const needRef = p.referral && s.referral;
  a += statusRow(t('refT'), needRef ? 'yes' : 'no', needRef ? t('refYes') : t('refNo'));
  if(s.pharmacy) a += `<div class="alert a-blue">${esc(t('pharmNote'))}</div>`;
  $('approvals').innerHTML = a;

  // cost
  const r = estimate(sk, pk, net, dedMet, oopMet);
  const youPct = r.price ? Math.min(100, (r.total - r.balance) / r.price * 100) : 0;
  let c = `<div class="bigsub">${esc(t('youPay'))}</div><div class="big">${money(r.total)}</div>`;
  c += `<div class="bigsub">${esc(t('fullPrice', {x: money(r.price)}))} · ${esc(t('planPays', {x: money(r.plan)}))}</div>`;
  c += `<div class="bar" aria-hidden="true"><i style="width:${youPct}%;background:#d9822b"></i><i style="width:${100-youPct}%;background:#0f766e"></i></div>`;
  c += `<div class="legend"><span style="--c:#d9822b">${esc(t('lgYou'))}</span><span style="--c:#0f766e">${esc(t('lgPlan'))}</span></div>`;
  c += `<div class="rows" style="margin-top:12px">`;
  if(r.copay) c += `<div class="row"><span>${esc(t('rCopay'))}</span><b>${money(r.copay)}</b></div>`;
  if(r.dedApplies && !r.notCovered) c += `<div class="row"><span>${esc(t('rDed'))}</span><b>${money(r.ded)}</b></div>`;
  if(r.coinsPct) c += `<div class="row"><span>${esc(t('rCoins', {p: r.coinsPct}))}</span><b>${money(r.coins)}</b></div>`;
  if(r.balance) c += `<div class="row"><span>${esc(t('rBalance'))}</span><b>${money(r.balance)}</b></div>`;
  c += `<div class="row total"><span>${esc(t('rTotal'))}</span><b>${money(r.total)}</b></div></div>`;

  // deductible status (in network only)
  if(!r.oon){
    if(r.oopReached) c += `<div class="alert a-teal">${esc(t('oopHit'))}</div>`;
    else if(!r.dedApplies) c += `<div class="alert a-teal">${esc(t('dedNone'))}${r.dedLeftBefore===0?' '+esc(t('dedMetMsg')):''}</div>`;
    else if(r.dedLeftBefore === 0) c += `<div class="alert a-teal">${esc(t('dedMetMsg'))}</div>`;
    else {
      const used = Math.min(p.ded, dedMet);
      c += `<div style="margin-top:12px"><div class="dedtxt">${esc(t('dedLeftMsg', {left: money(r.dedLeftBefore), use: money(r.ded)}))} ${esc(t('dedAfter', {left: money(r.dedLeftAfter)}))}</div>`;
      const pctMet = used / p.ded * 100, pctNow = r.ded / p.ded * 100;
      c += `<div class="bar" aria-hidden="true"><i style="width:${pctMet}%;background:#0f766e"></i><i style="width:${pctNow}%;background:#d9822b"></i></div></div>`;
    }
    if(r.capped) c += `<div class="alert a-teal">${esc(t('oopCap'))}</div>`;
    if(net === 'unsure') c += `<div class="alert a-amber">${esc(t('unsure'))}</div>`;
  } else {
    c += `<div class="alert a-red">${esc(r.notCovered ? t('oonHmo') : t('oonPpo'))}</div>`;
  }
  $('cost').innerHTML = c;

  // questions
  const svcName = T[L].svc[sk];
  const ins = [t('q1', {s: svcName})];
  if(s.pa !== 'no') ins.push(t('q2'));
  if(s.precert) ins.push(t('q2b'));
  ins.push(t('q3'));
  if(needRef) ins.push(t('q6'));
  ins.push(t('q4'), t('q5'));
  const prov = [t('p1')];
  if(s.pa !== 'no' || s.precert) prov.push(t('p2'));
  prov.push(t('p3'), t('p4'));
  window._script = [t('whoIns'), ...ins.map((q,i) => (i+1)+'. '+q), '', t('whoProv'), ...prov.map((q,i) => (i+1)+'. '+q)].join('\n');
  $('script').innerHTML =
    `<div class="who">${esc(t('whoIns'))}</div><ol class="script">${ins.map(q => `<li>${esc(q)}</li>`).join('')}</ol>` +
    `<div class="who">${esc(t('whoProv'))}</div><ol class="script">${prov.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`;
}

['service','plan','dedMet','oopMet'].forEach(id => $(id).addEventListener('input', render));
document.querySelectorAll('input[name="net"]').forEach(el => el.addEventListener('change', render));
$('plan').addEventListener('change', () => {          // keep sample numbers sensible for the new plan

});
$('lang').addEventListener('change', e => {
  L = e.target.value; try{ localStorage.setItem('beforecare_lang', L); }catch(err){}
  staticText(); render(); $('copied').textContent = ''; $('cbOk').style.display = 'none';
});
$('copyBtn').addEventListener('click', async () => {

  catch(e){ $('copied').textContent = t('copyFail'); }

  e.preventDefault();

  ok.style.display = 'block'; ok.focus();
  $('cbForm').reset();                                 // nothing is kept
});

$('lang').value = L;
staticText();
$('plan').value = 'ppo'; $('service').value = 'mri'; $('dedMet').value = 800; $('oopMet').value = 950;
render();
